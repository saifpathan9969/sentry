services:
  - type: web
    name: sentry-security-app
    env: python
    region: oregon
    plan: free
    buildCommand: |
      # Install Python dependencies
      pip install -r requirements-minimal.txt
      
      # Create static directory
      mkdir -p backend/static
      
      # Create simple HTML frontend
      cat > backend/static/index.html << 'EOF'
      <!DOCTYPE html>
      <html lang="en">
      <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Sentry Security - AI Penetration Testing</title>
          <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body { 
                  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                  background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
                  color: #00ff00;
                  min-height: 100vh;
                  display: flex;
                  flex-direction: column;
                  align-items: center;
                  justify-content: center;
                  text-align: center;
              }
              .container { max-width: 800px; padding: 2rem; }
              h1 { font-size: 3rem; margin-bottom: 1rem; text-shadow: 0 0 20px #00ff00; }
              .subtitle { font-size: 1.2rem; margin-bottom: 2rem; opacity: 0.8; }
              .login-form { 
                  background: rgba(0, 255, 0, 0.1);
                  border: 1px solid #00ff00;
                  border-radius: 10px;
                  padding: 2rem;
                  margin: 2rem 0;
                  box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
              }
              .form-group { margin-bottom: 1rem; text-align: left; }
              label { display: block; margin-bottom: 0.5rem; color: #00ff00; }
              input { 
                  width: 100%;
                  padding: 0.8rem;
                  background: rgba(0, 0, 0, 0.7);
                  border: 1px solid #00ff00;
                  border-radius: 5px;
                  color: #00ff00;
                  font-size: 1rem;
              }
              input:focus { outline: none; box-shadow: 0 0 10px #00ff00; }
              .btn { 
                  background: linear-gradient(45deg, #00ff00, #00cc00);
                  color: #000;
                  border: none;
                  padding: 1rem 2rem;
                  border-radius: 5px;
                  font-size: 1rem;
                  font-weight: bold;
                  cursor: pointer;
                  width: 100%;
                  margin-top: 1rem;
                  transition: all 0.3s;
              }
              .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 255, 0, 0.4); }
              .status { margin-top: 2rem; padding: 1rem; background: rgba(0, 255, 0, 0.1); border-radius: 5px; }
          </style>
      </head>
      <body>
          <div class="container">
              <h1>🛡️ SENTRY SECURITY</h1>
              <div class="subtitle">AI-Powered Penetration Testing Platform</div>
              
              <div class="login-form">
                  <h2>🔐 Secure Login</h2>
                  <form id="loginForm">
                      <div class="form-group">
                          <label for="email">Email:</label>
                          <input type="email" id="email" value="saifullahpathan49@gmail.com" required>
                      </div>
                      <div class="form-group">
                          <label for="password">Password:</label>
                          <input type="password" id="password" value="Sentry@779969" required>
                      </div>
                      <button type="submit" class="btn">🚀 LOGIN & START SCANNING</button>
                  </form>
              </div>
              
              <div class="status" id="status">
                  ✅ Backend API: Connected<br>
                  ✅ Database: SQLite Ready<br>
                  ✅ AI Brain: Neural Networks Loaded<br>
                  ✅ Scanner: Real Pentest Engine Active
              </div>
          </div>
          
          <script>
              document.getElementById('loginForm').addEventListener('submit', async (e) => {
                  e.preventDefault();
                  const email = document.getElementById('email').value;
                  const password = document.getElementById('password').value;
                  const status = document.getElementById('status');
                  
                  status.innerHTML = '🔄 Authenticating...';
                  
                  try {
                      const response = await fetch('/api/v1/auth/login', {
                          method: 'POST',
                          headers: { 'Content-Type': 'application/json' },
                          body: JSON.stringify({ email, password })
                      });
                      
                      if (response.ok) {
                          const data = await response.json();
                          localStorage.setItem('token', data.access_token);
                          status.innerHTML = '✅ Login successful! Welcome to Sentry Security!';
                      } else {
                          const error = await response.json();
                          status.innerHTML = '❌ Login failed: ' + (error.detail || 'Invalid credentials');
                      }
                  } catch (err) {
                      status.innerHTML = '❌ Connection error: ' + err.message;
                  }
              });
          </script>
      </body>
      </html>
      EOF
      
      echo "✅ Build completed successfully!"
    startCommand: |
      cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./sentry.db
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: OWNER_EMAILS
        value: "saifullahpathan49@gmail.com,saifullah.pathan24@sanjivani.edu.in"
    disk:
      name: sentry-disk
      mountPath: /opt/render/project/backend
      sizeGB: 1