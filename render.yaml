services:
  - type: web
    name: ai-pentest-brain-neural-schema
    env: python
    region: oregon
    plan: free
    buildCommand: |
      echo "🧠 Building AI Pentest Brain Web Service..."
      pip install --upgrade pip
      pip install -r requirements-minimal.txt
      echo "✅ Dependencies installed"
      echo "📁 Checking pentest brain files..."
      ls -la *.py | grep -E "(ai_pentest|pentest_brain)" || echo "⚠️ Pentest brain files not found"
      echo "🏗️ Build complete"
    startCommand: python start.py
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
    disk:
      name: pentest-brain-disk
      mountPath: /opt/render/project/data
      sizeGB: 1