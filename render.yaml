services:
  - type: web
    name: sentry-neural-pentesting-brain
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements-minimal.txt && echo "Backend-only build complete"
    startCommand: python start.py
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./sentry.db
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: OWNER_EMAILS
        value: "saifullahpathan49@gmail.com,saifullah.pathan24@sanjivani.edu.in"
    disk:
      name: sentry-disk
      mountPath: /opt/render/project/backend
      sizeGB: 1