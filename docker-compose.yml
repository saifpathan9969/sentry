version: '3.8'

services:
  # Backend API with CLI Tool Integration
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentry-backend
    environment:
      DATABASE_URL: sqlite:///./pentest_brain.db
      SECRET_KEY: sentry_super_secret_key_change_in_production_2024
      JWT_SECRET_KEY: sentry_jwt_secret_key_2024
      ENVIRONMENT: production
      DEBUG: false
      PROJECT_NAME: Sentry Security Platform
      VERSION: 3.0.0
    ports:
      - "8000:8000"
    volumes:
      - ./:/workspace
      - scan_results:/app/scan_results
      - scan_logs:/app/logs
    networks:
      - sentry-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # Frontend with Enhanced Neural Brain
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentry-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - sentry-network

volumes:
  scan_results:
  scan_logs:

networks:
  sentry-network:
    driver: bridge
